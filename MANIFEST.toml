long_description = """
A toolbar on Picard's main window with two dropdowns:

**Save to.** The folders you name in the plugin's settings - for example
Lossless and Lossy - one click apart. Choosing one sets Picard's destination
directory (Options > File Naming > Move files to this directory), turns
Move files on and, when you linked a naming script to that folder, makes it
the active script. Browse... picks any other folder for this session.

**Naming script.** Every file naming script Picard knows, as in Options >
File naming scripts; Edit... opens Picard's script editor.

Move files and Rename files can be switched from the toolbar too. Everything
is Picard's own setting: the toolbar only shows and changes it, and follows
when you change it elsewhere. Settings under Options > Plugins > Destination
Switcher.
"""
